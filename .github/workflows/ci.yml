name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  application:
    name: Application
    runs-on: ${{ (github.actor == github.repository_owner && github.triggering_actor == github.repository_owner) && 'r540-linux' || 'ubuntu-24.04' }}
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: mmt
          POSTGRES_PASSWORD: ci-fixture-password
          POSTGRES_DB: mmt_test
        ports: ['5432:5432']
        options: >-
          --tmpfs /var/lib/postgresql/data
          --health-cmd "pg_isready -U mmt -d mmt_test"
          --health-interval 5s --health-timeout 3s --health-retries 20
    env:
      MMT_TEST_DATABASE_URL: postgresql://mmt:ci-fixture-password@127.0.0.1:5432/mmt_test
      TZ: Asia/Tokyo
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build
      - run: npm test
      - run: node --test scripts/release/bundle.node-test.mjs

  python:
    name: Python SDK and worker
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install SDK and test dependencies
        run: |
          python3 -m venv .venv
          .venv/bin/python -m pip install './python[test,telemetry]'
          printf '%s\n' "$PWD/.venv/bin" >> "$GITHUB_PATH"
      - run: .venv/bin/python -m pytest python/tests

  images:
    name: Release images
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Build the five application images
        run: |
          tag="v$(node -p 'require("./package.json").version')"
          node scripts/release/images.mjs | jq -r '.include[] | [.image, .dockerfile] | @tsv' \
            | while IFS=$'\t' read -r image dockerfile; do
              docker buildx build --load -f "$dockerfile" -t "ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/$image:$tag" .
            done
      - name: Verify a fresh installation from the release bundle
        run: node scripts/release/verifyImages.mjs "v$(node -p 'require("./package.json").version')"
