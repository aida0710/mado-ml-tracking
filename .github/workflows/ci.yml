name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  application:
    name: Application
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: mmt
          POSTGRES_PASSWORD: ci-fixture-password
          POSTGRES_DB: mmt_test
        ports: ['5432:5432']
        options: >-
          --tmpfs /var/lib/postgresql/data
          --health-cmd "pg_isready -U mmt -d mmt_test"
          --health-interval 5s --health-timeout 3s --health-retries 20
    env:
      MMT_TEST_DATABASE_URL: postgresql://mmt:ci-fixture-password@127.0.0.1:5432/mmt_test
      TZ: Asia/Tokyo
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run build
      - run: npm test
      - run: node --test scripts/release/bundle.node-test.mjs
      # mado S3 Data CatalogのCIと同じく、配布する依存（devDependenciesを除く）の既知の脆弱性を調べる。
      - run: npm audit --omit=dev

  python:
    name: Python SDK and worker
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install SDK and test dependencies
        run: |
          python3 -m venv .venv
          .venv/bin/python -m pip install './python[test,telemetry]'
          printf '%s\n' "$PWD/.venv/bin" >> "$GITHUB_PATH"
      - run: .venv/bin/python -m pytest python/tests

  browser:
    name: Browser checks with the mock API
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      TZ: Asia/Tokyo
      # Playwrightはアプリの依存に入れていない（手元ではインストール済みのものをMMT_PLAYWRIGHT_MODULEで
      # 指す）。CIでは、この版とその版に合うChromiumをジョブの中で入れる。
      PLAYWRIGHT_VERSION: 1.62.1
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Install Playwright and Chromium
        run: |
          npm install --prefix "$RUNNER_TEMP/playwright" "playwright@$PLAYWRIGHT_VERSION"
          "$RUNNER_TEMP/playwright/node_modules/.bin/playwright" install --with-deps chromium
          printf 'MMT_PLAYWRIGHT_MODULE=%s\n' "$RUNNER_TEMP/playwright/node_modules/playwright/index.mjs" >> "$GITHUB_ENV"
      - run: scripts/ci/run-mock-browser-checks.sh "$RUNNER_TEMP/browser-checks"
      - if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: browser-check-logs
          path: ${{ runner.temp }}/browser-checks

  images:
    name: Release images
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Build the five application images
        run: |
          tag="v$(node -p 'require("./package.json").version')"
          node scripts/release/images.mjs | jq -r '.include[] | [.image, .dockerfile] | @tsv' \
            | while IFS=$'\t' read -r image dockerfile; do
              docker buildx build --load -f "$dockerfile" -t "ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/$image:$tag" .
            done
      - name: Verify a fresh installation from the release bundle
        run: node scripts/release/verifyImages.mjs "v$(node -p 'require("./package.json").version')"
