# このファイルがどのディレクトリにあっても、コンテナとvolume（mado-model-tracking_postgresなど）の
# 名前が変わらないよう固定する。リリースのbundleは版の名前のディレクトリに展開されるため。
# mado-model-trackingという名前でcheckoutした環境が既に使っている名前に合わせている。
# .envにCOMPOSE_PROJECT_NAMEがあれば、そちらが優先される。
name: mado-model-tracking
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: mmt
      POSTGRES_USER: mmt
      POSTGRES_PASSWORD: ${MMT_POSTGRES_PASSWORD:?Set MMT_POSTGRES_PASSWORD}
    volumes:
      - postgres:/var/lib/postgresql/data
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U mmt -d mmt']
      interval: 5s
      timeout: 3s
      retries: 20
  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    env_file: .env
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: 4182
      AUTH_MODE: oidc
      # webのnginxがX-Forwarded-Forにクライアントを追記する。その前にproxyを置くなら1つにつき1を足す。
      MMT_TRUSTED_PROXY_HOPS: ${MMT_TRUSTED_PROXY_HOPS:-1}
      MMT_DATABASE_URL: postgresql://mmt:${MMT_POSTGRES_PASSWORD:?Set MMT_POSTGRES_PASSWORD}@postgres:5432/mmt
      ARTIFACT_FILESYSTEM_ROOT: /app/var/artifacts
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - artifacts:/app/var/artifacts
    # 配布イメージに curl が無いので、Node の fetch で GET /healthz（DB への接続まで確かめる）を叩く。
    healthcheck:
      test: [CMD, node, -e, "fetch('http://127.0.0.1:4182/healthz').then((response) => process.exit(response.ok ? 0 : 1), () => process.exit(1))"]
      interval: 5s
      timeout: 3s
      retries: 3
      start_period: 60s
    restart: unless-stopped
  # 長い音声・動画の波形のピーク、スペクトログラム、動画のポスター画像をffmpegで作る。
  # APIにffmpegを入れないよう別のイメージにしている。DBとArtifactの保存領域はAPIと共有する。
  preview:
    build:
      context: .
      dockerfile: Dockerfile.preview
    env_file: .env
    environment:
      NODE_ENV: production
      MMT_DATABASE_URL: postgresql://mmt:${MMT_POSTGRES_PASSWORD:?Set MMT_POSTGRES_PASSWORD}@postgres:5432/mmt
      ARTIFACT_FILESYSTEM_ROOT: /app/var/artifacts
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - artifacts:/app/var/artifacts
      # ダウンロードした元のファイルを一度に1つだけ置く。MMT_PREVIEW_MAX_SOURCE_BYTES（10 GiB）まで。
      - preview-work:/app/var/preview-work
    # 処理中のArtifactが、コンテナが止まる前に今の段階を終えられるようにする。
    stop_grace_period: 30s
    restart: unless-stopped
  web:
    build:
      context: .
      dockerfile: Dockerfile.web
    # nginx は起動時に api の名前を引くので、API が応答できるようになってから起動する。
    depends_on:
      api:
        condition: service_healthy
    # webイメージのnginxは非特権で動き、8080で待ち受ける（Dockerfile.web）。
    ports: ['127.0.0.1:5182:8080']
    restart: unless-stopped
  # 任意: `docker compose --profile worker up -d worker`。workerはsystemdのunit（deploy/worker/）で
  # 動かすのが基本（docs/operations.mdを参照）。
  worker:
    profiles: [worker]
    build:
      context: .
      dockerfile: Dockerfile.worker
      args:
        WORKER_UID: ${MMT_WORKER_UID:-10001}
        WORKER_GID: ${MMT_WORKER_GID:-10001}
    environment:
      MMT_API_URL: ${MMT_WORKER_API_URL:-http://api:4182}
      MMT_WORKER_ID: ${MMT_WORKER_ID:-compose-worker-1}
      MMT_WORKER_TARGET_IDS: ${MMT_WORKER_TARGET_IDS:-}
    secrets: [mmt_worker_token]
    volumes:
      # 実行中のJobのjournal。volumeを消すと、それらのJobは放棄される。
      - worker-state:/var/lib/mado-tracking-worker
      # コンピュータのsshKeyPath・knownHostsPathには、コンテナ内の/home/worker/.sshの下を指定する。
      - ${MMT_WORKER_SSH_DIR:-./var/worker-ssh}:/home/worker/.ssh:ro
    # workerはSIGTERMで監視を止め、journalを残す。書き出しを終える時間を与える。
    stop_grace_period: 30s
    restart: unless-stopped
  # 任意: `docker compose --profile launcher up -d launcher`。site Jobを受け取り、siteごとの
  # job shellをSSHで実行する。結果は計算ノードのrunnerが報告する。deploy/sites/を参照。
  launcher:
    profiles: [launcher]
    build:
      context: .
      dockerfile: Dockerfile.launcher
      args:
        LAUNCHER_UID: ${MMT_LAUNCHER_UID:-10002}
        LAUNCHER_GID: ${MMT_LAUNCHER_GID:-10002}
    environment:
      # API（api_url。例: http://api:4182）、tokenファイル、状態ディレクトリを書いたファイル。
      # site、job shell、アカウントは、ポーリングのたびにAPIから受け取る。
      MMT_LAUNCHER_CONFIG: /etc/mado-tracking-launcher/launcher.toml
    volumes:
      # launcher.toml（deploy/sites/examples/launcher.toml）。
      - ${MMT_LAUNCHER_CONFIG_DIR:-./var/launcher-config}:/etc/mado-tracking-launcher:ro
      # launcher.tomlが指す、launcherのtokenとregistryのログイン情報（mode 600のファイル）。
      - ${MMT_LAUNCHER_SECRETS_DIR:-./var/launcher-secrets}:/run/secrets/mado-tracking-launcher:ro
      # launcher.tomlのstate_directory: launcherが作るSSHの秘密鍵、siteのknown_hosts、
      # 投入中のsubmission、まだ届けていない報告。
      - launcher-state:/var/lib/mado-tracking-launcher
    # SIGTERMを受けると、launcherは今のポーリングを終えてから止まる。停止で途切れた報告は
    # 状態のvolumeに残り、次の起動時に送る。
    stop_grace_period: 30s
    restart: unless-stopped
  # 任意: `docker compose --profile forge up -d forgejo`。Jobの雛形のGitリポジトリ、ミラー、
  # コンテナレジストリを置く。ログインはAuthentik。deploy/forgejo/README.mdを参照。
  forgejo:
    profiles: [forge]
    image: codeberg.org/forgejo/forgejo:16.0.5-rootless
    environment:
      # 起動のたびにapp.iniへ書き込まれる（FORGEJO__<section>__<KEY>）。ここに秘密の値は書かない。
      # secret keyはファイルで渡し、OIDCのclient secretはForgejoの管理画面で入力する。
      FORGEJO__server__DOMAIN: ${MMT_FORGEJO_DOMAIN:-forge.example.org}
      FORGEJO__server__ROOT_URL: https://${MMT_FORGEJO_DOMAIN:-forge.example.org}/
      FORGEJO__server__SSH_DOMAIN: ${MMT_FORGEJO_SSH_DOMAIN:-${MMT_FORGEJO_DOMAIN:-forge.example.org}}
      # clone用のURLに出すポート。下のSSHのポート割り当てのホスト側。内蔵のSSHサーバーは
      # コンテナ内の2222で待ち受ける。
      FORGEJO__server__SSH_PORT: ${MMT_FORGEJO_SSH_PORT:-2222}
      FORGEJO__server__SSH_LISTEN_PORT: '2222'
      FORGEJO__database__DB_TYPE: sqlite3
      FORGEJO__security__INSTALL_LOCK: 'true'
      # secret keyが無いと、Forgejoは内蔵の、公開されている値を使ってしまう。
      FORGEJO__security__SECRET_KEY_URI: file:/run/secrets/forgejo_secret_key
      # アカウントはAuthentik（OIDC）での初回ログインで作られる。それ以外の方法では登録できない。
      FORGEJO__service__DISABLE_REGISTRATION: 'false'
      FORGEJO__service__ALLOW_ONLY_EXTERNAL_REGISTRATION: 'true'
      FORGEJO__service__REQUIRE_SIGNIN_VIEW: 'true'
      FORGEJO__oauth2_client__ENABLE_AUTO_REGISTRATION: 'true'
      FORGEJO__oauth2_client__USERNAME: preferred_username
      FORGEJO__oauth2_client__ACCOUNT_LINKING: login
      # コンテナレジストリはhttps://<MMT_FORGEJO_DOMAIN>/v2/（イメージ名は<domain>/<owner>/<name>）。
      FORGEJO__packages__ENABLED: 'true'
    secrets: [forgejo_secret_key]
    volumes:
      # リポジトリ、package（コンテナイメージ）、SQLiteのデータベース、app.ini。
      - forgejo-data:/var/lib/gitea
    ports:
      # TLSのリバースプロキシがhttps://<MMT_FORGEJO_DOMAIN>/（web、git、registry）をここへ転送する。
      - 127.0.0.1:${MMT_FORGEJO_HTTP_PORT:-3000}:3000
      # SSH経由のgit。MMT_FORGEJO_SSH_BINDに利用者が届くアドレスを指定するまでは、
      # loopbackだけで受ける。
      - ${MMT_FORGEJO_SSH_BIND:-127.0.0.1}:${MMT_FORGEJO_SSH_PORT:-2222}:2222
    healthcheck:
      test: [CMD, curl, -fsS, 'http://127.0.0.1:3000/api/healthz']
      interval: 30s
      timeout: 5s
      retries: 5
    # 停止時に、実行中のpushとpullを終えられるようにする。
    stop_grace_period: 60s
    restart: unless-stopped
secrets:
  mmt_worker_token:
    file: ${MMT_WORKER_TOKEN_FILE:-./var/worker-token}
  # Forgejoのコンテナのユーザー（uid 1000）が読む。deploy/forgejo/README.mdを参照。
  forgejo_secret_key:
    file: ${MMT_FORGEJO_SECRET_KEY_FILE:-./var/forgejo-secret-key}
volumes:
  postgres:
  artifacts:
  worker-state:
  preview-work:
  launcher-state:
  forgejo-data:
