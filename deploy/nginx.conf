server {
    # The web image runs nginx unprivileged (Dockerfile.web), which cannot bind ports below 1024.
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    # Keeps the nginx version out of the Server header and error pages.
    server_tokens off;
    # The API enforces MMT_ARTIFACT_MAX_BYTES and answers 413 artifact_too_large itself.
    client_max_body_size 0;
    location /api/ {
        proxy_pass http://api:4182;
        proxy_http_version 1.1;
        # Stream uploads to the API so its size limit applies before the whole body is spooled.
        proxy_request_buffering off;
        proxy_buffering off;
        # Upload timeouts are idle intervals, matching MMT_UPLOAD_IDLE_TIMEOUT_MS (120s) rather than
        # nginx's 60s default, so a long upload is cut only when bytes stop flowing.
        client_body_timeout 120s;
        proxy_send_timeout 120s;
        # Waits for the API to finish storing a large artifact after the last byte arrives.
        proxy_read_timeout 3600s;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        # The API reads the client from the right end (MMT_TRUSTED_PROXY_HOPS, 1 in compose.yml).
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
    # The same security headers as Mado's web nginx, plus a Content-Security-Policy. There is no
    # HSTS here: TLS ends at the reverse proxy in front. They are set only on the screens: /api/
    # answers with its own headers (Artifact bytes carry a sandboxing policy).
    # The policy: everything the Web loads is its own bundle. Vite emits the scripts, the fonts and
    # the Monaco and audio-analysis Web Workers as files; Monaco's stylesheet has data: images and
    # Monaco sets inline styles at run time, hence img-src data: and style-src 'unsafe-inline'.
    # Media and Markdown images come from this origin's /api/. There is no 'unsafe-eval': Zod's
    # compiled parsers are turned off in apps/web/src/zodConfig.ts.
    location / {
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; media-src 'self'; connect-src 'self'; worker-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "no-referrer" always;
        try_files $uri $uri/ /index.html;
    }
}
