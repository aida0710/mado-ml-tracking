server {
    # The web image runs nginx unprivileged (Dockerfile.web), which cannot bind ports below 1024.
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    # The API enforces MMT_ARTIFACT_MAX_BYTES and answers 413 artifact_too_large itself.
    client_max_body_size 0;
    location /api/ {
        proxy_pass http://api:4182;
        proxy_http_version 1.1;
        # Stream uploads to the API so its size limit applies before the whole body is spooled.
        proxy_request_buffering off;
        proxy_buffering off;
        # Upload timeouts are idle intervals, matching MMT_UPLOAD_IDLE_TIMEOUT_MS (120s) rather than
        # nginx's 60s default, so a long upload is cut only when bytes stop flowing.
        client_body_timeout 120s;
        proxy_send_timeout 120s;
        # Waits for the API to finish storing a large artifact after the last byte arrives.
        proxy_read_timeout 3600s;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        # The API reads the client from the right end (MMT_TRUSTED_PROXY_HOPS, 1 in compose.yml).
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
    location / {
        try_files $uri $uri/ /index.html;
    }
}
