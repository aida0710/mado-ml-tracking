server {
    # webイメージはnginxを非特権で動かす（Dockerfile.web）ので、1024未満のポートでは待ち受けられない。
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    # Serverヘッダーとエラーページにnginxの版を出さない。
    server_tokens off;
    # MMT_ARTIFACT_MAX_BYTESはAPIが守らせ、413 artifact_too_largeもAPI自身が返す。
    client_max_body_size 0;
    location /api/ {
        proxy_pass http://api:4182;
        proxy_http_version 1.1;
        # 本文全体をため込む前にAPIの大きさの上限が効くよう、アップロードをAPIへそのまま流す。
        proxy_request_buffering off;
        proxy_buffering off;
        # アップロードのタイムアウトは無通信の間隔。nginxの既定の60秒でなくMMT_UPLOAD_IDLE_TIMEOUT_MS
        # （120秒）に合わせ、長いアップロードはバイトが流れなくなったときだけ切る。
        client_body_timeout 120s;
        proxy_send_timeout 120s;
        # 最後のバイトが届いたあと、APIが大きなArtifactを保存し終えるのを待つ。
        proxy_read_timeout 3600s;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        # APIはクライアントを右端から読む（MMT_TRUSTED_PROXY_HOPS。compose.ymlでは1）。
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
    # API のヘルスチェック。worker・SDK はこの hostname で API の到達を確かめるので、/api の外にある
    # GET /healthz も API へ渡す。
    location = /healthz {
        proxy_pass http://api:4182;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }
    # mado S3 Data Catalogのwebのnginxと同じセキュリティヘッダーに、Content-Security-Policyを足す。
    # TLSは前段のリバースプロキシで終わるので、ここではHSTSを付けない。ヘッダーは画面にだけ付ける。
    # /api/は自分のヘッダーで応答する（Artifactの中身にはsandboxのpolicyが付く）。
    # policyの考え方: 画面が読み込むものはすべて自分のbundle。Viteはスクリプト、フォント、Monacoと
    # 音声解析のWeb Workerをファイルとして出力する。Monacoのスタイルシートにはdata:の画像があり、
    # Monacoは実行時にインラインのスタイルを設定する。そのため、img-src data:と
    # style-src 'unsafe-inline'を許す。
    # メディアとMarkdownの画像はこのoriginの/api/から読む。'unsafe-eval'は許さない。Zodのコンパイル
    # 済みのparserはapps/web/src/zodConfig.tsで無効にしている。
    location / {
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; media-src 'self'; connect-src 'self'; worker-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "no-referrer" always;
        try_files $uri $uri/ /index.html;
    }
}
