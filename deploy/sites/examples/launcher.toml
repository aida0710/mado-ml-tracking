# mado-tracking-launcherの設定（--configかMMT_LAUNCHER_CONFIGで指定）。起動に要るものだけを書く。
# site、job shell、アカウント、鍵は画面で設定し、ポーリングのたびにAPIから読むので、変えても
# 再起動は要らない。値はすべて例。相対パスはこのファイルのディレクトリから数える。

# launcherから見たAPIの場所。composeのprojectの中ならhttp://api:4182。
api_url = "http://api:4182"
# 全体管理者がこのlauncherを登録したときに画面が一度だけ表示したtoken。launcherのユーザーが所有する
# mode 600のファイルに、tokenだけを書いて置く。このtokenで届くのは/api/launcher/*だけ。
token_file = "/run/secrets/mado-tracking-launcher/launcher.token"
# launcherが作るSSHの秘密鍵、siteのknown_hosts、投入中のsubmission、まだ届けていない報告を置く。
# 再起動しても残し（composeのserviceはここにvolumeをマウントする）、launcherごとに別のものにする。
# 失うと鍵が新しくなり、許可し直す必要がある。
state_directory = "/var/lib/mado-tracking-launcher"
# ポーリングの間隔（秒）。
poll_seconds = 10
# 任意: イメージをSIFへpullするための、読み取り専用のregistryのtoken。すべてのsiteのrunnerが使う。
# mode 600のファイルにJSON {"username": ..., "password": ...}で書く。apptainer pullにはrunnerの
# 環境変数を通してだけ渡る。
# registry_secret_file = "/run/secrets/mado-tracking-launcher/registry.json"
