[build-system]
# SPDXの`license`の文字列と`license-files`（PEP 639）を読む最初の版が77。
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "mado-tracking"
version = "0.5.2"
description = "mado ML Tracking Python SDK and durable compute worker"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.11"
dependencies = ["httpx>=0.27,<1"]

[project.optional-dependencies]
telemetry = ["psutil>=5.9,<8", "nvidia-ml-py>=12,<14"]
# 任意: これらを入れると、Run.log_audio・log_imageがnumpyの配列とPILの画像を受け付ける。
media = ["numpy>=1.24", "Pillow>=10"]
# テストはnumpyの配列とPILの画像をエンコードするので、media extraのpackageも入れる。
test = ["pytest>=8,<10", "mypy>=1.11,<2", "ruff>=0.9,<1", "numpy>=1.24", "Pillow>=10"]

[project.scripts]
mado-tracking = "mado_tracking.cli:main"
mado-tracking-worker = "mado_tracking.worker.cli:main"
mado-tracking-launcher = "mado_tracking.site.launcher_cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
mado_tracking = ["py.typed"]

[tool.setuptools.data-files]
"share/mado-tracking/examples" = ["examples/*.py"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.mypy]
python_version = "3.11"
strict = true
packages = ["mado_tracking"]
mypy_path = "src"

[tool.ruff]
target-version = "py311"
line-length = 110

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]
