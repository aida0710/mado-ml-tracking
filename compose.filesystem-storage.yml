# 任意: 画面（全体設定 → 全体管理 → ストレージ）から追加するファイルシステムの保存先に使う、
# ホストのディレクトリ。APIとpreviewのコンテナの中に同じパスで見せるので、ルートディレクトリが
# ホストでも画面でも同じに読める。.envで有効にする:
#   COMPOSE_FILE=compose.yml:compose.filesystem-storage.yml   （compose.override.ymlを使うなら追加する）
#   MMT_FILESYSTEM_STORAGE_DIR=/srv/mmt/storage
# ディレクトリは先に作り、uid 1000（コンテナのnodeユーザー）が書き込めるようにしておく。無いままだと
# Dockerがrootで作り、コンテナから書き込めない。
services:
  api:
    volumes:
      - ${MMT_FILESYSTEM_STORAGE_DIR:?Set MMT_FILESYSTEM_STORAGE_DIR}:${MMT_FILESYSTEM_STORAGE_DIR}
  # 同じファイルからプレビューを作るので、同じディレクトリを見せる。
  preview:
    volumes:
      - ${MMT_FILESYSTEM_STORAGE_DIR:?Set MMT_FILESYSTEM_STORAGE_DIR}:${MMT_FILESYSTEM_STORAGE_DIR}
